spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USER:tasks}
    # Пароль намеренно без значения по умолчанию: в профиле dev/test он
    # переопределён на H2, а боевой запуск обязан получить DB_PASSWORD извне.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Все даты пишутся и читаются в UTC независимо от часового пояса сервера
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  # В контейнере приложение обязано слушать 0.0.0.0 (иначе порт не проброшен),
  # но это значение по умолчанию: локальный запуск в профиле dev прижат к loopback.
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

# Ключи клиентов: см. SecurityProperties. Пусто — API закрыт для всех.
# Задаются переменными окружения, например:
#   APP_SECURITY_APIKEYS_0_ID=billing
#   APP_SECURITY_APIKEYS_0_SHA256=<sha256 от ключа>
app:
  security:
    api-keys: []

springdoc:
  # В спецификацию попадают только наши контроллеры, служебные эндпоинты — нет.
  packages-to-scan: ru.strata.tasks.web
  # По умолчанию OpenAPI и Swagger UI выключены; профили dev и test включают их явно.
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
