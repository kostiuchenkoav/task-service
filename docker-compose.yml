# Локальный стенд: PostgreSQL + self container приложения.
# Пароль БД и хеш API-ключа берутся из файла .env (см. .env.example);
# старт без них запрещён.
#   cp .env.example .env   # затем задать POSTGRES_PASSWORD и API_KEY_SHA256
#   docker compose up --build
#
# Оба порта публикуются только на 127.0.0.1, чтобы стенд не был доступен
# из локальной сети.

services:
  postgres:
    image: postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    # Жёсткие ограничения контейнера: файловая система только для чтения,
    # временная папка в памяти, никаких дополнительных привилегий
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tasks}
      DB_USER: ${POSTGRES_USER:-tasks}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}"
      # Ключ клиента: в конфиге только SHA-256 от ключа (см. .env.example)
      APP_SECURITY_APIKEYS_0_ID: "${API_KEY_ID:-local}"
      # Тенант: все задачи, созданные этим ключом, принадлежат ему
      APP_SECURITY_APIKEYS_0_TENANT: "${API_KEY_TENANT:-local}"
      APP_SECURITY_APIKEYS_0_SHA256: "${API_KEY_SHA256:?Set API_KEY_SHA256 in .env (see .env.example)}"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
