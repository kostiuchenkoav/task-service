# Локальный запуск без внешней БД: in-memory H2 в режиме PostgreSQL.
# Запуск: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# dev включает H2-консоль (/h2-console) с пустым паролем, поэтому интерфейс
# намеренно прижат к loopback: из локальной сети ни API, ни консоль не видны.
#
# Ключ dev-key — только для локальной разработки, в проде он не используется.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: jdbc:h2:mem:tasks;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    api-keys:
      # значение ключа: dev-key (SHA-256 записан, сам ключ в файле не хранится)
      - id: dev
        tenant: local
        sha256: 7e9f8fd111802be56c379d597842e29b2cebd35ff2133d431a49fa556a18704e

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
