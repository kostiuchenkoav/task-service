# Интеграционные тесты (Spring-контекст) работают на H2, без Docker и PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:task-service-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# Тестовые ключи (в конфиге только SHA-256, сами ключи нигде не записаны):
#   test-key   -> клиент test-a, тенант tenant-a
#   test-key-b -> клиент test-b, тенант tenant-b
# Два тенанта нужны, чтобы тесты изоляции проверяли реальную границу.
app:
  security:
    api-keys:
      - id: test-a
        tenant: tenant-a
        sha256: 62af8704764faf8ea82fc61ce9c4c3908b6cb97d463a634e9e587d7c885db0ef
      - id: test-b
        tenant: tenant-b
        sha256: b28592d358781a58d1e486318d9bd54382141142d48b0f1f74e9838a42f2bf53

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
