spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USER:tasks}
    # Пароль намеренно без значения по умолчанию: в профиле dev/test он
    # переопределён на H2, а боевой запуск обязан получить DB_PASSWORD извне.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  # В контейнере приложение обязано слушать 0.0.0.0 (иначе порт не проброшен),
  # но это значение по умолчанию: локальный запуск в профиле dev прижат к loopback.
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

springdoc:
  # В спецификацию попадают только наши контроллеры, служебные эндпоинты — нет.
  packages-to-scan: ru.strata.tasks.web
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
